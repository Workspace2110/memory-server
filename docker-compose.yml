services:
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - ./data/qdrant:/qdrant/storage
    ports:
      - "6333:6333"
    restart: unless-stopped

  memory-server:
    build:
      context: ./mcp-server
    depends_on:
      - qdrant
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - MCP_TRANSPORT=http
      - MCP_API_KEY=${MCP_API_KEY}
      - HOST=0.0.0.0
      - PORT=${PORT:-8000}
    restart: unless-stopped
