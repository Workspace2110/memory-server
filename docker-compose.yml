services:
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - ./data/qdrant:/qdrant/storage
    ports:
      - "6333:6333"
    restart: unless-stopped

  memory-server:
    build:
      context: ./mcp-server
    depends_on:
      - qdrant
    environment:
      - QDRANT_URL=http://qdrant:6333
    restart: unless-stopped
